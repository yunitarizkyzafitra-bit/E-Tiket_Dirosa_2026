<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Monitoring Tiket MWD</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root { --emerald: #064e3b; --gold: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; margin: 0; display: flex; }
        .sidebar { width: 250px; background: var(--emerald); color: white; height: 100vh; padding: 20px; }
        .content { flex-grow: 1; padding: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        .emerald-btn { background: var(--emerald); color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <aside class="sidebar"><h2>MWD Control</h2><nav><p onclick="location.reload()">📊 Dashboard</p></nav></aside>
    <main class="content">
        <section id="login-section" class="card">
            <h3>Verifikasi Petugas</h3>
            <input type="text" id="input-pj" placeholder="Nama PJ">
            <input type="password" id="input-pin" placeholder="PIN">
            <button class="emerald-btn" onclick="handleLogin()">Login</button>
        </section>

        <section id="dashboard-section" style="display:none;">
            <div style="display:flex; gap:20px;">
                <div class="card" style="width:30%"><h3>Sisa Tiket</h3><p id="sisa">0</p></div>
                <div class="card" style="width:70%"><div id="chart_div" style="height:200px;"></div></div>
            </div>
            <div class="card">
                <h3>Log Transaksi</h3>
                <table id="logTable"><thead><tr><th>Waktu</th><th>PJ</th><th>Pembeli</th><th>Jumlah</th></tr></thead><tbody></tbody></table>
            </div>
        </section>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxfxgk8boK-t8a5jYyFh58Is8Rc4Y8KqE8cerE_N_hGClluVmXT2rCQaNv_rwSC-4tR/exec";
        
        async function handleLogin() {
            const nama = document.getElementById('input-pj').value;
            const pin = document.getElementById('input-pin').value;
            fetch(`${GAS_URL}?action=login&nama=${nama}&pin=${pin}`)
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                    loadDashboard();
                } else { alert("Kredensial Tidak Sesuai!"); }
            });
        }

        async function loadDashboard() {
            fetch(`${GAS_URL}?action=getData`)
            .then(res => res.json())
            .then(res => {
                document.getElementById('sisa').innerText = res.sisa;
                let tbody = document.querySelector("#logTable tbody");
                res.data.forEach(row => {
                    tbody.innerHTML += `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[4]}</td></tr>`;
                });
                google.charts.load('current', {'packages':['corechart']});
                google.charts.setOnLoadCallback(() => {
                    var data = google.visualization.arrayToDataTable([['Status', 'Jumlah'],['Terjual', res.terjual],['Sisa', res.sisa]]);
                    new google.visualization.PieChart(document.getElementById('chart_div')).draw(data, {title: 'Grafik Penjualan'});
                });
            });
        }
    </script>
</body>
</html>
