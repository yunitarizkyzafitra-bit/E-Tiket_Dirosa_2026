<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Kontrol Tiket Dirosa Angkatan 9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --emerald: #064e3b; }
        .sidebar-dark-emerald { background-color: var(--emerald) !important; }
        .nav-link.active { background-color: #047857 !important; color: #fff !important; }
        .ticket-box { padding: 5px; text-align: center; border-radius: 3px; color: white; font-weight: bold; font-size: 10px; border: 1px solid white; cursor: pointer; }
        .bg-hijau { background-color: #10b981; } .bg-merah { background-color: #ef4444; }
        .print-only { display: none; }
        #input-panel { display: none; }
        @media print {
            .print-only { display: block !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="layout-fixed">
    <div class="wrapper">
        <aside class="main-sidebar sidebar-dark-emerald elevation-4 no-print">
            <div class="brand-link text-center border-bottom"><span class="brand-text font-weight-bold text-white">Dirosa Angkatan 9</span></div>
            <div class="sidebar">
                <div class="text-center py-3"><img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/logo%20MWD.png" width="80%" style="border-radius: 5px; border: 2px solid white;"></div>
                <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column"><li class="nav-item"><a href="#" class="nav-link active">Dashboard</a></li></ul></nav>
            </div>
        </aside>

        <div class="content-wrapper p-4">
            <div class="row">
                <div class="col-md-5">
                    <div class="card p-3"><canvas id="myChart"></canvas></div>
                    <div class="card p-3 mt-2">
                        <h6>Performa Penjualan Per-Pekan</h6>
                        <div id="weekly-stats"></div>
                    </div>
                </div>
                <div class="col-md-7 card p-3">
                    <button class="btn btn-warning btn-sm no-print mb-2" onclick="window.print()"><i class="fas fa-file-pdf"></i> Export PDF</button>
                    <button class="btn btn-primary btn-sm no-print mb-2" onclick="showAuth()"><i class="fas fa-lock"></i> Input Tiket</button>
                    <div id="input-panel">
                        <h5>Input Tiket (Contoh: 10-15)</h5>
                        <input type="text" id="no" class="form-control" placeholder="No Tiket/Rentang">
                        <input type="date" id="tgl" class="form-control mt-2">
                        <select id="pj" class="form-control mt-2"><option>Ummu Nabila</option><option>Teteh Lilis</option><option>Ummu Yasmin</option></select>
                        <select id="status" class="form-control mt-2"><option>Terjual</option></select>
                        <input type="text" id="hp" class="form-control mt-2" placeholder="Nomor HP">
                        <input type="text" id="alamat" class="form-control mt-2" placeholder="Alamat">
                        <div class="mt-3"><button class="btn btn-success" onclick="save()">Simpan</button> <button class="btn btn-secondary" onclick="closeInput()">Kembali</button></div>
                    </div>
                </div>
            </div>
            <div class="card p-3 mt-3"><h5>Grid Tiket</h5><div id="grid" style="display:grid; grid-template-columns: repeat(25, 1fr); gap: 2px;"></div></div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxer4zw2ckbLHlFI8GZ1tHjMhRUuUuHdA5EC_496s_KsGVW8YWWkxZV1PZg90HaPy-Ikw/exec";

        async function init() {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            
            // 1. Grafik Donat
            let sold = data.filter(r => r[4] === 'Terjual').length;
            new Chart(document.getElementById('myChart'), { type: 'doughnut', data: { labels: ['Terjual', 'Sisa'], datasets: [{ data: [sold, 450-sold], backgroundColor: ['#ef4444', '#10b981'] }] } });
            
            // 2. Statistik Pekanan (Logic: Grouping by Week Number)
            const weekly = {};
            data.filter(r => r[4] === 'Terjual').forEach(r => {
                let date = new Date(r[1]);
                let week = Math.ceil((((date - new Date(date.getFullYear(), 0, 1)) / 86400000) + 1) / 7);
                let key = "Pekan " + week;
                weekly[key] = (weekly[key] || 0) + 1;
            });

            const statBox = document.getElementById('weekly-stats');
            statBox.innerHTML = "";
            for (let w in weekly) {
                let percent = ((weekly[w] / 450) * 100).toFixed(1);
                statBox.innerHTML += `<div class="mb-2"><b>${w}:</b> ${weekly[w]} Tiket (${percent}%)</div>`;
            }

            // 3. Grid
            const grid = document.getElementById('grid'); grid.innerHTML = "";
            for(let i=1; i<=450; i++) {
                let status = data.find(r => r[0] == i) ? 'bg-merah' : 'bg-hijau';
                let div = document.createElement('div');
                div.className = `ticket-box ${status}`; div.innerText = i;
                div.onclick = () => { if(status === 'bg-hijau') showAuth(i); };
                grid.appendChild(div);
            }
        }

        async function showAuth(n) {
            let u = prompt("Username:"); let p = prompt("PIN:");
            const res = await fetch(`${GAS_URL}?action=login&user=${u}&pin=${p}`);
            if((await res.json()).status) { document.getElementById('input-panel').style.display = 'block'; if(n) document.getElementById('no').value = n; }
            else alert("Ditolak");
        }

        async function save() {
            let range = document.getElementById('no').value.split('-');
            for (let i = parseInt(range[0]); i <= (range[1] || range[0]); i++) {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ no: i, tgl: document.getElementById('tgl').value, pj: document.getElementById('pj').value, status: "Terjual", hp: document.getElementById('hp').value, alamat: document.getElementById('alamat').value }) });
            }
            alert("Tersimpan!"); document.getElementById('no').value = ''; init();
        }
        
        function closeInput() { document.getElementById('input-panel').style.display = 'none'; }
        window.onload = init;
    </script>
</body>
</html>
