<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Kontrol Tiket Dirosa Angkatan 9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --emerald: #064e3b; }
        .sidebar-dark-emerald { background-color: var(--emerald) !important; }
        .nav-link.active { background-color: #047857 !important; color: #fff !important; }
        .ticket-box { padding: 5px; text-align: center; border-radius: 3px; color: white; font-weight: bold; font-size: 10px; border: 1px solid white; cursor: pointer; }
        .bg-hijau { background-color: #10b981; } .bg-merah { background-color: #ef4444; }
        .print-only { display: none; }
        #input-panel { display: none; }
        @media print {
            .print-only { display: block !important; }
            .no-print { display: none !important; }
            .bg-merah { background-color: #ef4444 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .bg-hijau { background-color: #10b981 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="layout-fixed">
    <div class="wrapper">
        <aside class="main-sidebar sidebar-dark-emerald elevation-4 no-print">
            <div class="brand-link text-center border-bottom">
                <span class="brand-text font-weight-bold text-white" style="font-size: 14px; display: block; white-space: normal; line-height: 1.2;">Kontrol Tiket Tasyakuran Dirosa Angkatan 9</span>
            </div>
            <div class="sidebar">
                <div class="text-center py-3"><img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/logo%20MWD.png" width="80%" style="border-radius: 5px; border: 2px solid white;"></div>
                <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column"><li class="nav-item"><a href="#" class="nav-link active">Dashboard</a></li></ul></nav>
                <div style="position: absolute; bottom: 20px; width: 100%; padding: 0 15px;">
                    <img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/Gambar%20Tiket.png" width="100%" style="border-radius: 5px;">
                </div>
            </div>
        </aside>

        <div class="content-wrapper p-4">
            <div class="row">
                <div class="col-md-5"><div class="card p-3"><canvas id="myChart"></canvas></div></div>
                <div class="col-md-7 card p-3">
                    <button class="btn btn-warning btn-sm no-print mb-2" onclick="window.print()"><i class="fas fa-file-pdf"></i> Export PDF</button>
                    <button class="btn btn-primary btn-sm no-print mb-2" onclick="showAuth()"><i class="fas fa-lock"></i> Login Input Data</button>
                    <div id="input-panel">
                        <h5>Input Data (Bisa Kelipatan, misal: 10-20)</h5>
                        <input type="text" id="no" class="form-control" placeholder="No Tiket atau Rentang (Contoh: 10-19)">
                        <input type="date" id="tgl" class="form-control mt-2">
                        <select id="pj" class="form-control mt-2"><option value="Ummu Nabila">Ummu Nabila</option><option value="Teteh Lilis">Teteh Lilis</option><option value="Ummu Yasmin">Ummu Yasmin</option></select>
                        <select id="status" class="form-control mt-2"><option value="Terjual">Terjual</option></select>
                        <input type="text" id="hp" class="form-control mt-2" placeholder="Nomor HP">
                        <input type="text" id="alamat" class="form-control mt-2" placeholder="Alamat">
                        <div class="mt-3">
                            <button class="btn btn-success" onclick="save()">Simpan Data</button>
                            <button class="btn btn-secondary" onclick="closeInput()">Kembali</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card p-3 mt-3">
                <h5>Grid Tiket (Klik untuk Login & Jual)</h5>
                <div id="grid" style="display:grid; grid-template-columns: repeat(25, 1fr); gap: 2px;"></div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzxmJe0vKAJdHcMUG0w1HLwsmBhtAwY4oa9tbib-SARSuzwDYrMX0GbWb62l1R8XMtKTA/exec";

        async function init() {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            const grid = document.getElementById('grid'); grid.innerHTML = "";
            
            for(let i=1; i<=450; i++) {
                let rowData = data.find(r => r[0] == i);
                let status = rowData ? rowData[4] : "Tersedia";
                let div = document.createElement('div');
                div.className = `ticket-box ${status == 'Terjual' ? 'bg-merah' : 'bg-hijau'}`;
                div.innerText = i;
                // Keamanan: Klik grid harus login dulu
                div.onclick = () => { if(status !== 'Terjual') showAuth(i); };
                grid.appendChild(div);
            }
        }

        async function showAuth(prefillNo = "") {
            let u = prompt("Username:"); let p = prompt("PIN:");
            const res = await fetch(`${GAS_URL}?action=login&user=${u}&pin=${p}`);
            const result = await res.json();
            if(result.status) { 
                document.getElementById('input-panel').style.display = 'block';
                if(prefillNo) document.getElementById('no').value = prefillNo;
            } else { alert("Akses Ditolak"); }
        }

        async function save() {
            let noInput = document.getElementById('no').value; // Mendukung "10-20"
            let range = noInput.split('-');
            let start = parseInt(range[0]);
            let end = range.length > 1 ? parseInt(range[1]) : start;

            for (let i = start; i <= end; i++) {
                let p = { no: i, tgl: document.getElementById('tgl').value, pj: document.getElementById('pj').value, target: "Umum", status: "Terjual", ket: "Manual", hp: document.getElementById('hp').value, alamat: document.getElementById('alamat').value };
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(p) });
            }
            alert("Data Berhasil Disimpan!");
            document.getElementById('no').value = ''; document.getElementById('hp').value = ''; document.getElementById('alamat').value = '';
            init();
        }

        function closeInput() { document.getElementById('input-panel').style.display = 'none'; }
        window.onload = init;
    </script>
</body>
</html>
