<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Kontrol Tiket Dirosa Angkatan 9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --emerald: #064e3b; }
        .sidebar-dark-emerald { background-color: var(--emerald) !important; }
        .nav-link.active { background-color: #047857 !important; color: #fff !important; }
        .ticket-box { padding: 5px; text-align: center; border-radius: 3px; color: white; font-weight: bold; font-size: 10px; border: 1px solid white; cursor: pointer; transition: transform 0.2s; }
        .ticket-box:hover { transform: scale(1.1); }
        .bg-hijau { background-color: #10b981; } .bg-merah { background-color: #ef4444; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); gap: 4px; }
        .table-responsive { overflow-x: auto; }
        @media print { .no-print { display: none !important; } }
        @media (max-width: 768px) { .content-wrapper { padding: 10px !important; } }
    </style>
</head>
<body class="layout-fixed">
    <div class="wrapper">
        <aside class="main-sidebar sidebar-dark-emerald elevation-4 no-print">
            <div class="brand-link text-center border-bottom">
                <span class="brand-text font-weight-bold text-white" style="font-size: 13px;">Kontrol Tiket Dirosa Angk.9</span>
            </div>
            <div class="sidebar">
                <div class="text-center py-3"><img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/logo%20MWD.png" width="80%" style="border-radius: 5px; border: 2px solid white;"></div>
                <div style="position: absolute; bottom: 20px; width: 100%; padding: 0 15px;">
                    <img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/Gambar%20Tiket.png" width="100%" style="border-radius: 5px;">
                </div>
            </div>
        </aside>

        <div class="content-wrapper p-3">
            <div class="row">
                <div class="col-md-5">
                    <div class="card p-3"><canvas id="myChart"></canvas></div>
                    <div class="card p-2 text-center"><h6>Total Penjualan</h6><h2 id="total-percent">0%</h2></div>
                </div>
                <div class="col-md-7">
                    <div class="card p-3">
                        <button class="btn btn-warning btn-sm mb-2" onclick="window.print()"><i class="fas fa-file-pdf"></i> Export PDF</button>
                        <button class="btn btn-primary btn-sm mb-2" onclick="showAuth()"><i class="fas fa-lock"></i> Input Tiket</button>
                        <div id="input-panel" style="display:none;">
                            <h6 class="text-danger" id="counter-display"></h6>
                            <input type="text" id="no" class="form-control" placeholder="No Tiket">
                            <input type="date" id="tgl" class="form-control mt-1">
                            <select id="pj" class="form-control mt-1"><option>Ummu Nabila</option><option>Teteh Lilis</option><option>Ummu Yasmin</option><option>Cadangan</option></select>
                            <input type="text" id="hp" class="form-control mt-1" placeholder="No HP">
                            <input type="text" id="alamat" class="form-control mt-1" placeholder="Alamat">
                            <button class="btn btn-success mt-2" onclick="save()">Simpan</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card p-3 mt-3"><h5>Grid Tiket</h5><div id="grid"></div></div>

            <div class="card p-3">
                <h5>Riwayat Transaksi</h5>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-sm text-xs">
                        <thead class="bg-dark"><tr><th>Tgl</th><th>No</th><th>PJ</th><th>Alamat</th><th>HP</th><th>Status</th></tr></thead>
                        <tbody id="transaksi-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxrl-u8EOK3CdSyeDoxISiqsq6oHkXKSwAtdQbek769mBoFAzk4Lc5wSYD5ObjbQaFK8w/exec";
        let sessionCount = 0;

        async function init() {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            const tbody = document.getElementById('transaksi-body');
            tbody.innerHTML = "";
            data.slice().reverse().forEach(r => {
                tbody.innerHTML += `<tr><td>${r[1]}</td><td>${r[0]}</td><td>${r[2]}</td><td>${r[7]}</td><td>${r[6]}</td><td>${r[4]}</td></tr>`;
            });
            // Update UI Chart & Grid... (Logika chart tetap sama)
            // ... [Script logika existing disematkan di sini]
        }
        // ... [Fungsi save, showAuth, dll tetap sama]
        window.onload = init;
    </script>
</body>
</html>
