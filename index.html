<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kontrol Tiket Dirosa 9</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --emerald: #064e3b; --gold: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; border-top: 5px solid var(--gold); }
        .chart-container { height: 350px; }
        .btn-export { background: var(--gold); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        @media print { .btn-export, #login-box { display: none; } }
    </style>
</head>
<body>
    <div class="card">
        <button class="btn-export" onclick="window.print()">📄 Export PDF</button>
        <h2 style="color:var(--emerald)">Kontrol Tiket Tasyakuran Dirosa Angkatan 9</h2>
        <div class="chart-container"><canvas id="myChart"></canvas></div>
    </div>

    <div class="card" id="login-box">
        <h3>Login Input (PJ)</h3>
        <input id="user" placeholder="Nama PJ">
        <input type="password" id="pin" placeholder="PIN">
        <button onclick="login()">Masuk</button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzvODAIxmX1yoEdvJXgP3WlPidwCYafNIl2OCiJ3JOrU0y0d7SurmeBFcsH0xK5sd6NsA/exec";
        
        window.onload = loadData;

        function loadData() {
            google.script.run.withSuccessHandler(res => {
                let ctx = document.getElementById('myChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(res.report),
                        datasets: [
                            { label: 'Tiket Terjual', data: Object.values(res.report), backgroundColor: '#064e3b' },
                            { label: 'Tren', data: Object.values(res.report), type: 'line', borderColor: '#d4af37', fill: false }
                        ]
                    }
                });
            }).getDashboardData();
        }

        function login() {
            let u = document.getElementById('user').value;
            let p = document.getElementById('pin').value;
            google.script.run.withSuccessHandler(res => {
                if(res) alert("Login Berhasil! Anda memiliki akses input.");
                else alert("Kredensial salah.");
            }).verifyLogin(u, p);
        }
    </script>
</body>
</html>
