<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kontrol Tiket Dirosa 9</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --emerald: #064e3b; --gold: #d4af37; }
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn-export { background: var(--gold); color: white; border: none; padding: 10px; cursor: pointer; }
        canvas { max-height: 300px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Dashboard Tiket Dirosa 9</h1>
        <button class="btn-export" onclick="window.print()">Export PDF</button>
    </div>

    <div class="card">
        <canvas id="myChart"></canvas>
    </div>

    <script>
        // Masukkan URL Web App (GAS) Anda di sini untuk menghubungkan ke Spreadsheet
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz77FRmKZs1EMd46O_B7-2UIuO43Ecxado2Btrjewt9fjhS5rIkhohp8WROD3QyGzzRYw/exec";

        async function fetchData() {
            // Mengambil data dari Google Sheets via GAS
            const response = await fetch(GAS_URL);
            const data = await response.json();
            renderChart(data);
        }

        function renderChart(data) {
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Terjual', 'Tersedia'],
                    datasets: [{ label: 'Jumlah Tiket', data: [data.terjual, data.tersedia], backgroundColor: '#064e3b' }]
                }
            });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
