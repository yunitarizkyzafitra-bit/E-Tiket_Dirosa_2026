<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Kontrol Tiket Dirosa Angkatan 9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --emerald: #064e3b; }
        .sidebar-dark-emerald { background-color: var(--emerald) !important; }
        .nav-link.active { background-color: #047857 !important; color: #fff !important; }
        .ticket-box { padding: 5px; text-align: center; border-radius: 3px; color: white; font-weight: bold; font-size: 10px; border: 1px solid white; cursor: pointer; }
        .bg-hijau { background-color: #10b981; } .bg-merah { background-color: #ef4444; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 3px; }
        .print-only { display: none; }
        #input-panel { display: none; }
        @media print { .no-print { display: none !important; } }
        @media (max-width: 768px) { .content-wrapper { padding: 10px !important; } }
    </style>
</head>
<body class="layout-fixed">
    <div class="wrapper">
        <aside class="main-sidebar sidebar-dark-emerald elevation-4 no-print">
            <div class="brand-link text-center border-bottom">
                <span class="brand-text font-weight-bold text-white" style="font-size: 13px; display: block; white-space: normal; line-height: 1.2;">Kontrol Penjualan Tiket Tasyakuran Angk.9</span>
            </div>
            <div class="sidebar">
                <div class="text-center py-3"><img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/logo%20MWD.png" width="80%" style="border-radius: 5px; border: 2px solid white;"></div>
                <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column"><li class="nav-item"><a href="#" class="nav-link active">Dashboard</a></li></ul></nav>
                <div style="position: absolute; bottom: 20px; width: 100%; padding: 0 15px;">
                    <img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/Gambar%20Tiket.png" width="100%" style="border-radius: 5px;">
                </div>
            </div>
        </aside>

        <div class="content-wrapper p-4">
            <div class="row">
                <div class="col-12 col-md-5">
                    <div class="card p-3"><canvas id="myChart"></canvas></div>
                    <div class="card p-3 mt-2 text-center"><h6>Total Progres Penjualan</h6><h2 id="total-percent">0%</h2></div>
                </div>
                <div class="col-12 col-md-7 card p-3">
                    <button class="btn btn-primary btn-sm no-print mb-2" onclick="showAuth()"><i class="fas fa-lock"></i> Input Tiket</button>
                    <div id="input-panel">
                        <h5>Input Tiket (Zona PJ)</h5>
                        <input type="text" id="no" class="form-control" placeholder="No Tiket/Rentang">
                        <input type="date" id="tgl" class="form-control mt-2">
                        <select id="pj" class="form-control mt-2">
                            <option value="Ummu Nabila">Ummu Nabila (1-100)</option>
                            <option value="Teteh Lilis">Teteh Lilis (101-200)</option>
                            <option value="Ummu Yasmin">Ummu Yasmin (201-350)</option>
                            <option value="Cadangan">Cadangan (351-450)</option>
                        </select>
                        <input type="text" id="hp" class="form-control mt-2" placeholder="Nomor HP">
                        <input type="text" id="alamat" class="form-control mt-2" placeholder="Alamat">
                        <div class="mt-3"><button class="btn btn-success" onclick="save()">Simpan</button> <button class="btn btn-secondary" onclick="closeInput()">Kembali</button></div>
                    </div>
                </div>
            </div>
            
            <div class="card p-3 mt-3"><h5>Grid Tiket</h5><div id="grid"></div></div>
            
            <div class="card p-3 mt-3">
                <h5>Riwayat Transaksi</h5>
                <div class="table-responsive">
                    <table class="table table-sm table-striped">
                        <thead><tr><th>Tgl</th><th>No</th><th>PJ</th><th>Alamat</th><th>HP</th><th>Status</th></tr></thead>
                        <tbody id="transaksi-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbye3B7Sa85b8mAiNNz8U7tUMYJ75geouTIcFmTfqd3RslKqo095-GvHqnSEpE2K_LgMAA/exec";
        const zonaPJ = {"Ummu Nabila": [1, 100], "Teteh Lilis": [101, 200], "Ummu Yasmin": [201, 350], "Cadangan": [351, 450]};

        async function save() {
            let pj = document.getElementById('pj').value;
            let range = document.getElementById('no').value.split('-');
            let start = parseInt(range[0]), end = parseInt(range[1] || range[0]);
            if (start < zonaPJ[pj][0] || end > zonaPJ[pj][1]) { alert("Akses Ditolak! Luar zona PJ."); return; }
            for (let i = start; i <= end; i++) {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ no: i, tgl: document.getElementById('tgl').value, pj, status: "Terjual", hp: document.getElementById('hp').value, alamat: document.getElementById('alamat').value }) });
            }
            alert("Data Tersimpan!"); location.reload();
        }

        async function init() {
            const res = await fetch(GAS_URL); const data = await res.json();
            let sold = data.filter(r => r[4] === 'Terjual').length;
            document.getElementById('total-percent').innerText = ((sold / 450) * 100).toFixed(1) + "%";
            new Chart(document.getElementById('myChart'), { type: 'doughnut', data: { labels: ['Terjual', 'Sisa'], datasets: [{ data: [sold, 450-sold], backgroundColor: ['#ef4444', '#10b981'] }] } });
            
            const grid = document.getElementById('grid'), tbody = document.getElementById('transaksi-body');
            grid.innerHTML = ""; tbody.innerHTML = "";
            
            data.forEach(r => {
                tbody.insertAdjacentHTML('beforeend', `<tr><td>${r[1]}</td><td>${r[0]}</td><td>${r[2]}</td><td>${r[7]}</td><td>${r[6]}</td><td>Terjual</td></tr>`);
            });
            for(let i=1; i<=450; i++) {
                let div = document.createElement('div');
                div.className = `ticket-box ${data.find(r => r[0] == i) ? 'bg-merah' : 'bg-hijau'}`;
                div.innerText = i; div.onclick = () => showAuth(i);
                grid.appendChild(div);
            }
        }
        async function showAuth(n) {
            let u = prompt("Username:"), p = prompt("PIN:");
            const res = await fetch(`${GAS_URL}?action=login&user=${u}&pin=${p}`);
            if((await res.json()).status) { document.getElementById('input-panel').style.display = 'block'; if(n) document.getElementById('no').value = n; }
        }
        function closeInput() { document.getElementById('input-panel').style.display = 'none'; }
        window.onload = init;
    </script>
</body>
</html>
