<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyhI87O2-G75tfGoWkTqq2Bb-Vx9G0_IbL_mmLQ4A6UJtpUPEPEO6WTuglzE6hiW_JiYA/exec";
    let isSaving = false;

    async function init() {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        const tbody = document.getElementById('transaksi-body');
        tbody.innerHTML = data.slice().reverse().map(r => `<tr><td>${r[1]}</td><td>${r[0]}</td><td>${r[2]}</td><td>${r[4]}</td></tr>`).join('');
        
        let sold = data.filter(r => r[4] === 'Terjual').length;
        document.getElementById('total-percent').innerText = ((sold / 450) * 100).toFixed(1) + "%";
        new Chart(document.getElementById('myChart'), { type: 'doughnut', data: { datasets: [{ data: [sold, 450-sold], backgroundColor: ['#ef4444', '#10b981'] }] } });
        
        const grid = document.getElementById('grid'); grid.innerHTML = "";
        for(let i=1; i<=450; i++) {
            grid.innerHTML += `<div class="ticket-box ${data.find(r => r[0] == i) ? 'bg-merah' : 'bg-hijau'}">${i}</div>`;
        }

        let count = parseInt(localStorage.getItem('sessionCount') || 0);
        document.getElementById('counter-display').innerText = `Input hari ini: ${count}/10`;

        // Logika Persistent PIN
        const savedPin = localStorage.getItem('user_pin');
        if (savedPin) {
            const pinInput = document.getElementById('pin');
            pinInput.value = savedPin;
            pinInput.readOnly = true; // Mengunci agar tidak bisa diubah
            pinInput.placeholder = "PIN Tersimpan";
        }
    }

    async function save() {
        if (isSaving) return;
        let count = parseInt(localStorage.getItem('sessionCount') || 0);
        if (count >= 10) { alert("Batas 10 tiket tercapai. Login kembali untuk sesi baru."); return; }

        const pinInput = document.getElementById('pin').value;
        
        // Simpan ke storage jika belum ada
        if (!localStorage.getItem('user_pin')) {
            localStorage.setItem('user_pin', pinInput);
        }

        const payload = {
            no: document.getElementById('no').value,
            tgl: document.getElementById('tgl').value,
            pj: document.getElementById('pj').value,
            username: document.getElementById('username').value,
            pin: pinInput, // Mengambil dari variabel lokal yang sudah dipastikan ada
            hp: document.getElementById('hp').value,
            alamat: document.getElementById('alamat').value
        };

        if (!payload.no || !payload.username || !payload.pin) { alert("Lengkapi No Tiket, Username, dan PIN!"); return; }

        isSaving = true;
        const btn = document.getElementById('save-btn');
        btn.disabled = true; btn.innerText = "Mengirim...";

        try {
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            localStorage.setItem('sessionCount', count + 1);
            alert("Data berhasil tersimpan!");
            location.reload();
        } catch (e) {
            alert("Gagal koneksi. Cek Username/PIN atau jaringan Anda.");
            isSaving = false; btn.disabled = false; btn.innerText = "Simpan Data";
        }
    }

    function showAuth() { document.getElementById('input-panel').style.display = 'block'; }
    function closeInput() { document.getElementById('input-panel').style.display = 'none'; }
    window.onload = init;
</script>
