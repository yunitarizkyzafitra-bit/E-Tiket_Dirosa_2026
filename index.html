<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Kontrol Tiket Dirosa Angkatan 9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --emerald: #064e3b; }
        .sidebar-dark-emerald { background-color: var(--emerald) !important; }
        .ticket-box { padding: 5px; text-align: center; border-radius: 3px; color: white; font-weight: bold; font-size: 10px; border: 1px solid white; }
        .bg-hijau { background-color: #10b981; } .bg-merah { background-color: #ef4444; }
        .print-only { display: none; }
        #input-panel { display: none; } /* Terkunci secara default */
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
    </style>
</head>
<body class="layout-fixed">
    <div class="wrapper">
        <aside class="main-sidebar sidebar-dark-emerald elevation-4 no-print">
            <a href="#" class="brand-link text-white"><span class="brand-text font-weight-bold ml-2">Dirosa 9</span></a>
            <div class="sidebar"><nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column"><li class="nav-item"><a href="#" class="nav-link text-white">Dashboard</a></li></ul></nav></div>
        </aside>

        <div class="content-wrapper p-4">
            <div class="print-only text-center"><h1>LAPORAN TASYAKURAN DIROSA ANGKATAN 9</h1><hr></div>
            
            <div class="row">
                <div class="col-md-5"><div class="card p-3"><canvas id="myChart"></canvas></div></div>
                <div class="col-md-7 card p-3">
                    <button class="btn btn-warning btn-sm no-print mb-2" onclick="window.print()">Export PDF Profesional</button>
                    <!-- Tombol Pemicu Akses -->
                    <button class="btn btn-primary btn-sm no-print mb-2" onclick="showAuth()">Buka Menu Input Data</button>
                    
                    <!-- Panel Input yang Terkunci -->
                    <div id="input-panel">
                        <h5>Input Data Baru</h5>
                        <div class="row">
                            <div class="col-md-6"><input type="number" id="no" class="form-control" placeholder="No Tiket"></div>
                            <div class="col-md-6"><input type="date" id="tgl" class="form-control"></div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-md-6">
                                <select id="pj" class="form-control">
                                    <option value="Ummu Nabila">Ummu Nabila</option><option value="Teteh Lilis">Teteh Lilis</option>
                                    <option value="Ummu Yasmin">Ummu Yasmin</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <select id="target" class="form-control">
                                    <option value="Pengurus">Pengurus</option><option value="Dirosa dan Mudarrisah">Dirosa dan Mudarrisah</option>
                                    <option value="Umum">Umum</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-md-6"><select id="status" class="form-control"><option value="Tersedia">Tersedia</option><option value="Terjual">Terjual</option></select></div>
                            <div class="col-md-6"><input type="text" id="hp" class="form-control" placeholder="Nomor HP"></div>
                        </div>
                        <input type="text" id="ket" class="form-control mt-2" placeholder="Keterangan">
                        <button class="btn btn-success mt-3" onclick="save()">Simpan Data</button>
                    </div>
                </div>
            </div>

            <div class="card p-3">
                <h5>Grid Status Tiket (Total 450)</h5>
                <div id="grid" style="display:grid; grid-template-columns: repeat(25, 1fr); gap: 2px;"></div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw3T4D5fOYF-ksBkkrh6Mgv-iqVy8YqLwBoBfL3K8cslf8PfGn3EGhpFyMLgzhUMUy6tg/exec";

        async function init() {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            let sold = data.filter(r => r[4] === 'Terjual').length;
            new Chart(document.getElementById('myChart'), { type: 'doughnut', data: { labels: ['Terjual', 'Sisa'], datasets: [{ data: [sold, 450-sold], backgroundColor: ['#ef4444', '#10b981'] }] } });
            const grid = document.getElementById('grid');
            for(let i=1; i<=450; i++) {
                let status = (data.find(r => r[0] == i) || [])[4];
                grid.innerHTML += `<div class="ticket-box ${status == 'Terjual' ? 'bg-merah' : 'bg-hijau'}">${i}</div>`;
            }
        }

        async function showAuth() {
    let user = prompt("Masukkan Username:");
    let pin = prompt("Masukkan PIN:");
    
    // Memanggil Google Apps Script via API
    const response = await fetch(`${GAS_URL}?action=login&user=${user}&pin=${pin}`);
    const result = await response.json();
    
    if (result.status) {
        document.getElementById('input-panel').style.display = 'block';
        alert("Akses diberikan.");
    } else {
        alert("Username atau PIN salah.");
    }
}

        async function save() {
            let p = { no: document.getElementById('no').value, tgl: document.getElementById('tgl').value, pj: document.getElementById('pj').value, target: document.getElementById('target').value, status: document.getElementById('status').value, hp: document.getElementById('hp').value, ket: document.getElementById('ket').value };
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(p) });
            alert("Tersimpan!"); location.reload();
        }
        window.onload = init;
    </script>
</body>
</html>
