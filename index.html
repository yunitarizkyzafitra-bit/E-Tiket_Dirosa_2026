<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>MWD Professional Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #009688; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 250px; background: var(--primary); color: white; height: 100vh; padding: 20px; }
        .content { flex: 1; padding: 30px; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .chart-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #eee; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>MWD Admin</h3>
        <p>📊 Dashboard</p>
        <img src="MWD.png" style="width:100px; border-radius:50%; display:block; margin: 20px auto;">
        <img src="Gambar%20Tiket.png" style="width:150px; display:block; margin: 0 auto;">
    </div>

    <main class="content">
        <div id="login-box" class="card">
            <input type="text" id="user" placeholder="Nama">
            <input type="password" id="pass" placeholder="PIN">
            <button onclick="auth()">Login</button>
        </div>

        <div id="dashboard" style="display:none;">
            <div class="stats-row">
                <div class="card"><h4>Penjualan Hari Ini</h4><p id="harian">Rp 0</p></div>
                <div class="card"><h4>Penjualan Bulan Ini</h4><p id="bulanan">Rp 0</p></div>
            </div>
            <div class="chart-container">
                <canvas id="dailyChart" class="card"></canvas>
                <canvas id="monthlyChart" class="card"></canvas>
            </div>
            <div class="card">
                <h4>Log Transaksi</h4>
                <table id="log"><thead><tr><th>Tanggal</th><th>PJ</th><th>Jumlah</th></tr></thead><tbody></tbody></table>
            </div>
        </div>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbymM2YlXvco22JoVxpCRsD2VllI-VHRIXHZy1QZ1TTSh5dDZ15seXWpvire8qct1GcoxQ/exec";

        async function auth() {
            let n = document.getElementById('user').value;
            let p = document.getElementById('pass').value;
            let res = await fetch(`${GAS_URL}?action=login&nama=${n}&pin=${p}`).then(r => r.json());
            if(res.status === "success") {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                initData();
            } else { alert("Kredensial tidak sesuai. Periksa spasi/tipe data di Spreadsheet."); }
        }

        async function initData() {
            let res = await fetch(`${GAS_URL}?action=getData`).then(r => r.json());
            document.getElementById('harian').innerText = "Rp " + res.harian;
            // Rendering Chart menggunakan Chart.js
            new Chart(document.getElementById('dailyChart'), { type: 'line', data: { labels: res.labels, datasets: [{ label: 'Penjualan Harian', data: res.values }] } });
        }
    </script>
</body>
</html>
