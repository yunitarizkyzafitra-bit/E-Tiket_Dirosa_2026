<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Kontrol Tiket Dirosa Angkatan 9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --emerald: #064e3b; }
        .sidebar-dark-emerald { background-color: var(--emerald) !important; }
        .ticket-box { padding: 5px; text-align: center; border-radius: 3px; color: white; font-weight: bold; font-size: 10px; border: 1px solid white; cursor: pointer; }
        .bg-hijau { background-color: #10b981; } .bg-merah { background-color: #ef4444; }
        .print-only { display: none; }
        #input-panel { display: none; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
    </style>
</head>
<body class="layout-fixed">
    <div class="wrapper">
        <aside class="main-sidebar sidebar-dark-emerald elevation-4 no-print">
            <div class="brand-link text-center border-bottom"><span class="brand-text font-weight-bold text-white" style="font-size: 14px;">Kontrol Tiket Tasyakuran Dirosa Angkatan 9</span></div>
            <div class="sidebar">
                <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column"><li class="nav-item"><a href="#" class="nav-link text-white active">Dashboard</a></li></ul></nav>
                <div style="position: absolute; bottom: 20px; width: 100%; padding: 0 15px;">
                    <img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/Gambar%20Tiket.png" width="100%" style="border-radius: 5px;">
                </div>
            </div>
        </aside>

        <div class="content-wrapper p-4">
            <div class="row">
                <div class="col-md-5"><div class="card p-3"><canvas id="myChart"></canvas></div></div>
                <div class="col-md-7 card p-3">
                    <button class="btn btn-warning btn-sm no-print mb-2" onclick="window.print()">Export PDF</button>
                    <button class="btn btn-primary btn-sm no-print mb-2" onclick="showAuth()">Buka Menu Input Data</button>
                    <div id="input-panel">
                        <h5>Input Data Baru</h5>
                        <input type="number" id="no" class="form-control" placeholder="No Tiket">
                        <input type="date" id="tgl" class="form-control mt-2">
                        <select id="pj" class="form-control mt-2"><option value="Ummu Nabila">Ummu Nabila</option><option value="Teteh Lilis">Teteh Lilis</option><option value="Ummu Yasmin">Ummu Yasmin</option></select>
                        <select id="target" class="form-control mt-2"><option value="Pengurus">Pengurus</option><option value="Dirosa dan Mudarrisah">Dirosa dan Mudarrisah</option><option value="Umum">Umum</option></select>
                        <select id="status" class="form-control mt-2"><option value="Tersedia">Tersedia</option><option value="Terjual">Terjual</option></select>
                        <input type="text" id="hp" class="form-control mt-2" placeholder="Nomor HP">
                        <input type="text" id="alamat" class="form-control mt-2" placeholder="Alamat Lengkap">
                        <button class="btn btn-success mt-3" onclick="save()">Simpan Data</button>
                    </div>
                </div>
            </div>
            <div class="card p-3 mt-3">
                <h5>Grid Status Tiket (Total 450)</h5>
                <div id="grid" style="display:grid; grid-template-columns: repeat(25, 1fr); gap: 2px;"></div>
            </div>
            <div class="card p-3 mt-3">
                <h5>Daftar Pembeli Tiket</h5>
                <table class="table table-striped"><thead><tr><th>No</th><th>PJ</th><th>Status</th><th>Alamat</th></tr></thead><tbody id="buyer-table-body"></tbody></table>
            </div>
        </div>
    </div>

    <script>
        // GANTI URL DI BAWAH DENGAN URL DEPLOY TERBARU ANDA
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwLmKHaqQHDGiGmWyk0oJNLIn7n8IDPmZaRCxoez8WYGLnyvNnww44ysPxW60x5hdON3w/exec";

        async function init() {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            let sold = data.filter(r => r[4] === 'Terjual').length;
            new Chart(document.getElementById('myChart'), { type: 'doughnut', data: { labels: ['Terjual', 'Sisa'], datasets: [{ data: [sold, 450-sold], backgroundColor: ['#ef4444', '#10b981'] }] } });
            
            const grid = document.getElementById('grid');
            const tbody = document.getElementById('buyer-table-body');
            tbody.innerHTML = ""; grid.innerHTML = "";
            
            for(let i=1; i<=450; i++) {
                let rowData = data.find(r => r[0] == i);
                let status = rowData ? rowData[4] : "Tersedia";
                if(status === 'Terjual') tbody.innerHTML += `<tr><td>${i}</td><td>${rowData[2]}</td><td>${status}</td><td>${rowData[7] || '-'}</td></tr>`;
                
                let div = document.createElement('div');
                div.className = `ticket-box ${status == 'Terjual' ? 'bg-merah' : 'bg-hijau'}`;
                div.innerText = i;
                div.onclick = () => { if(status !== 'Terjual' && confirm("Jual Tiket " + i + "?")) quickSave(i); };
                grid.appendChild(div);
            }
        }

        async function showAuth() {
            let u = prompt("Username:"); let p = prompt("PIN:");
            const res = await fetch(`${GAS_URL}?action=login&user=${u}&pin=${p}`);
            const result = await res.json();
            if(result.status) { document.getElementById('input-panel').style.display = 'block'; }
            else { alert("Akses Ditolak"); }
        }

        async function quickSave(no) {
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ no, tgl: new Date().toISOString().split('T')[0], pj: "Admin", target: "Umum", status: "Terjual", ket: "Instan", hp: "-", alamat: "-" }) });
            location.reload();
        }

        async function save() {
            let p = { no: document.getElementById('no').value, tgl: document.getElementById('tgl').value, pj: document.getElementById('pj').value, target: document.getElementById('target').value, status: document.getElementById('status').value, hp: document.getElementById('hp').value, ket: "Manual", alamat: document.getElementById('alamat').value };
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(p) });
            alert("Tersimpan!"); location.reload();
        }
        window.onload = init;
    </script>
</body>
</html>
