<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Kontrol Tiket Dirosa 9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand-box">
                <img src="URL_LOGO_MWD_ANDA.png" class="sidebar-logo">
                <h2>MWD</h2>
            </div>
            <nav>
                <a href="#" onclick="showSection('dashboard')">📊 Dashboard</a>
                <a href="#" onclick="showSection('input')">✍️ Input Transaksi</a>
            </nav>
            <div class="ticket-preview">
                <img src="URL_GAMBAR_TIKET_ANDA.png" class="ticket-img">
            </div>
        </aside>

        <main id="main-content" class="content">
            <header class="app-header"><h1>Kontrol Tiket Dirosa 9</h1></header>

            <section id="login-section" class="card">
                <h3>Verifikasi Petugas</h3>
                <input type="text" id="input-pj" placeholder="Nama PJ" class="input-field">
                <div style="position: relative;">
                    <input type="password" id="input-pin" placeholder="PIN Otorisasi" class="input-field">
                    <span id="toggle-pin" onclick="toggleVisibility()" style="position: absolute; right: 15px; top: 12px; cursor: pointer;">👁️</span>
                </div>
                <button class="emerald-btn" onclick="handleLogin()">Login</button>
            </section>

            <section id="dashboard-section" style="display:none;">
                <div class="metrics-grid">
                    <div class="card"><h3>Total</h3><p id="total">0</p></div>
                    <div class="card"><h3>Terjual</h3><p id="terjual" class="status-terjual">0</p></div>
                    <div class="card"><h3>Sisa</h3><p id="sisa" class="status-tersedia">0</p></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwt91vNNDBqssMWmWp2VkuCHsqVT1YQ2BzsgqDfdKRZpl2ecfsMyZ8nR8IrLr4Xt9JTKQ/exec";

        function toggleVisibility() {
            const p = document.getElementById('input-pin');
            p.type = (p.type === "password") ? "text" : "password";
        }

        async function handleLogin() {
            const nama = document.getElementById('input-pj').value;
            const pin = document.getElementById('input-pin').value;
            fetch(`${GAS_URL}?action=login&nama=${nama}&pin=${pin}`)
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                } else {
                    document.getElementById('login-section').classList.add('shake');
                    alert("Kredensial Salah");
                }
            });
        }
    </script>
</body>
</html>
