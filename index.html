<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Tiket Dirosa 9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f4f6f9; }
        .wrapper { max-width: 900px; margin: auto; padding: 20px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card card-success card-outline">
            <div class="card-header">
                <h3 class="card-title">Kontrol Tiket Tasyakuran Dirosa 9</h3>
                <button class="btn btn-warning btn-sm float-right no-print" onclick="window.print()">Export PDF</button>
            </div>
            <div class="card-body">
                <canvas id="myChart" style="height:300px;"></canvas>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxAXmlq0gZRmIs9Wz8bNcWZrf9ppiXNB9enJ0OVkN_yuwC7AtOPSIwrJ_h4YvmnBPS8ag/exec";

        async function loadDashboard() {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            
            // Hitung data (Status di kolom D = index 3)
            let terjual = data.filter(r => r[3] === 'Terjual').length;
            let tersedia = data.filter(r => r[3] === 'Tersedia').length;

            new Chart(document.getElementById('myChart'), {
                type: 'bar',
                data: {
                    labels: ['Terjual', 'Tersedia'],
                    datasets: [{ label: 'Jumlah Tiket', data: [terjual, tersedia], backgroundColor: ['#dc3545', '#28a745'] }]
                }
            });
        }
        window.onload = loadDashboard;
    </script>
</body>
</html>
