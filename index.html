<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Kontrol Tiket Dirosa Angkatan 9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --emerald: #064e3b; }
        .sidebar-dark-emerald { background-color: var(--emerald) !important; }
        .nav-link.active { background-color: #047857 !important; color: #fff !important; }
        .ticket-box { padding: 5px; text-align: center; border-radius: 3px; color: white; font-weight: bold; font-size: 10px; border: 1px solid white; cursor: pointer; transition: transform 0.2s; }
        .ticket-box:hover { transform: scale(1.1); }
        .bg-hijau { background-color: #10b981; } .bg-merah { background-color: #ef4444; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); gap: 3px; }
        .chart-container { max-width: 200px; margin: 0 auto; }
        .table-responsive { overflow-x: auto; max-height: 400px; }
        @media print { .no-print { display: none !important; } }
        @media (max-width: 768px) { .content-wrapper { padding: 10px !important; } }
    </style>
</head>
<body class="layout-fixed">
    <div class="wrapper">
        <aside class="main-sidebar sidebar-dark-emerald elevation-4 no-print">
            <div class="brand-link text-center border-bottom"><span class="brand-text font-weight-bold text-white" style="font-size: 13px;">Kontrol Tiket Dirosa Angk.9</span></div>
            <div class="sidebar">
                <div class="text-center py-3"><img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/logo%20MWD.png" width="80%" style="border-radius: 5px; border: 2px solid white;"></div>
                <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column"><li class="nav-item"><a href="#" class="nav-link active">Dashboard</a></li></ul></nav>
                <div style="position: absolute; bottom: 20px; width: 100%; padding: 0 15px;"><img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/Gambar%20Tiket.png" width="100%" style="border-radius: 5px;"></div>
            </div>
        </aside>

        <div class="content-wrapper p-3">
            <div class="row">
                <div class="col-md-5">
                    <div class="card p-3"><div class="chart-container"><canvas id="myChart"></canvas></div></div>
                    <div class="card p-2 text-center"><h6>Total Penjualan</h6><h2 id="total-percent">0%</h2></div>
                </div>
                <div class="col-md-7">
                    <div class="card p-3">
                        <button class="btn btn-warning btn-sm mb-2" onclick="window.print()"><i class="fas fa-file-pdf"></i> Export PDF</button>
                        <button class="btn btn-primary btn-sm mb-2" onclick="showAuth()"><i class="fas fa-lock"></i> Input Tiket</button>
                        <div id="input-panel" style="display:none;">
                            <h6 class="text-danger" id="counter-display"></h6>
                            <input type="number" id="no" class="form-control" placeholder="No Tiket">
                            <input type="date" id="tgl" class="form-control mt-1">
                            <select id="pj" class="form-control mt-1">
                                <option>Ummu Nabila</option><option>Teteh Lilis</option>
                                <option>Ummu Yasmin</option><option>Cadangan</option>
                            </select>
                            <input type="text" id="username" class="form-control mt-1" placeholder="Username PJ">
                            <input type="password" id="pin" class="form-control mt-1" placeholder="PIN Akses">
                            <input type="text" id="hp" class="form-control mt-1" placeholder="No HP">
                            <input type="text" id="alamat" class="form-control mt-1" placeholder="Alamat">
                            <button id="save-btn" class="btn btn-success mt-2" onclick="save()">Simpan Data</button>
                            <button class="btn btn-secondary mt-2" onclick="closeInput()">Kembali</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card p-3 mt-3"><h5>Grid Tiket</h5><div id="grid"></div></div>

            <div class="card p-3">
                <h5>Riwayat Transaksi</h5>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-sm text-xs">
                        <thead class="bg-dark"><tr><th>Tgl</th><th>No</th><th>PJ</th><th>Status</th></tr></thead>
                        <tbody id="transaksi-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyhI87O2-G75tfGoWkTqq2Bb-Vx9G0_IbL_mmLQ4A6UJtpUPEPEO6WTuglzE6hiW_JiYA/exec";
        let isSaving = false;

        async function init() {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            const tbody = document.getElementById('transaksi-body');
            tbody.innerHTML = data.slice().reverse().map(r => `<tr><td>${r[1]}</td><td>${r[0]}</td><td>${r[2]}</td><td>${r[4]}</td></tr>`).join('');
            
            let sold = data.filter(r => r[4] === 'Terjual').length;
            document.getElementById('total-percent').innerText = ((sold / 450) * 100).toFixed(1) + "%";
            new Chart(document.getElementById('myChart'), { type: 'doughnut', data: { datasets: [{ data: [sold, 450-sold], backgroundColor: ['#ef4444', '#10b981'] }] } });
            
            const grid = document.getElementById('grid'); grid.innerHTML = "";
            for(let i=1; i<=450; i++) {
                grid.innerHTML += `<div class="ticket-box ${data.find(r => r[0] == i) ? 'bg-merah' : 'bg-hijau'}">${i}</div>`;
            }

            let count = parseInt(localStorage.getItem('sessionCount') || 0);
            document.getElementById('counter-display').innerText = `Input hari ini: ${count}/10`;
        }

        async function save() {
            if (isSaving) return;
            let count = parseInt(localStorage.getItem('sessionCount') || 0);
            if (count >= 10) { alert("Batas 10 tiket tercapai. Login kembali untuk sesi baru."); return; }

            const payload = {
                no: document.getElementById('no').value,
                tgl: document.getElementById('tgl').value,
                pj: document.getElementById('pj').value,
                username: document.getElementById('username').value,
                pin: document.getElementById('pin').value,
                hp: document.getElementById('hp').value,
                alamat: document.getElementById('alamat').value
            };

            if (!payload.no || !payload.username || !payload.pin) { alert("Lengkapi No Tiket, Username, dan PIN!"); return; }

            isSaving = true;
            const btn = document.getElementById('save-btn');
            btn.disabled = true; btn.innerText = "Mengirim...";

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                localStorage.setItem('sessionCount', count + 1);
                alert("Data berhasil tersimpan!");
                location.reload();
            } catch (e) {
                alert("Gagal koneksi. Cek Username/PIN atau jaringan Anda.");
                isSaving = false; btn.disabled = false; btn.innerText = "Simpan Data";
            }
        }

        function showAuth() { document.getElementById('input-panel').style.display = 'block'; }
        function closeInput() { document.getElementById('input-panel').style.display = 'none'; }
        window.onload = init;
    </script>
</body>
</html>
