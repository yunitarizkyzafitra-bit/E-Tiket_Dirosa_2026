<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kontrol Tiket Dirosa Angkatan 9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --emerald: #064e3b; }
        .sidebar-dark-emerald { background-color: var(--emerald) !important; }
        .ticket-box { padding: 5px; text-align: center; border-radius: 3px; color: white; font-weight: bold; font-size: 10px; border: 1px solid white; cursor: pointer; }
        .bg-hijau { background-color: #10b981; } .bg-merah { background-color: #ef4444; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 3px; }
        #input-panel { display: none; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="layout-fixed">
    <div class="wrapper">
        <aside class="main-sidebar sidebar-dark-emerald elevation-4 no-print">
            <div class="brand-link text-center border-bottom"><span class="brand-text font-weight-bold text-white">Kontrol Penjualan Tiket Tasyakuran Angk.9</span></div>
            <div class="sidebar">
                <div class="text-center py-3"><img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/logo%20MWD.png" width="80%" style="border-radius: 5px; border: 2px solid white;"></div>
                <div style="position: absolute; bottom: 20px; width: 100%; padding: 0 15px;">
                    <img src="https://raw.githubusercontent.com/yunitarizkyzafitra-bit/E-Tiket_Dirosa_2026/main/Gambar%20Tiket.png" width="100%" style="border-radius: 5px;">
                </div>
            </div>
        </aside>
        <div class="content-wrapper p-4">
            <div class="row">
                <div class="col-md-5"><div class="card p-3"><canvas id="myChart"></canvas></div></div>
                <div class="col-md-7 card p-3">
                    <button class="btn btn-primary btn-sm mb-2" onclick="showAuth()"><i class="fas fa-lock"></i> Input Tiket</button>
                    <div id="input-panel">
                        <input type="text" id="no" class="form-control" placeholder="No Tiket">
                        <input type="date" id="tgl" class="form-control mt-2">
                        <select id="pj" class="form-control mt-2"><option>Ummu Nabila</option><option>Teteh Lilis</option><option>Ummu Yasmin</option><option>Cadangan</option></select>
                        <input type="text" id="hp" class="form-control mt-2" placeholder="Nomor HP">
                        <input type="text" id="alamat" class="form-control mt-2" placeholder="Alamat">
                        <button class="btn btn-success mt-2" onclick="save()">Simpan</button>
                    </div>
                </div>
            </div>
            <div class="card p-3 mt-3"><h5>Grid Tiket</h5><div id="grid"></div></div>
        </div>
    </div>
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwhgunDk5yxwyqcSGws2o2uXdS7rOjR2qNZIOg8sNw3DWeTrc7FvjKwCpg35UTMWyn2PQ/exec";
        const pjRules = {"Ummu Nabila": [1, 100], "Teteh Lilis": [101, 200], "Ummu Yasmin": [201, 350], "Cadangan": [351, 450]};

        async function showAuth(n) {
            let p = prompt("PIN:");
            const res = await fetch(GAS_URL, {method: 'POST', body: JSON.stringify({action: 'login', pin: p})});
            if((await res.json()).status) { document.getElementById('input-panel').style.display = 'block'; if(n) document.getElementById('no').value = n; }
            else alert("PIN Salah!");
        }

        async function save() {
            let pj = document.getElementById('pj').value, no = parseInt(document.getElementById('no').value);
            if (no < pjRules[pj][0] || no > pjRules[pj][1]) { alert("Bukan PJ nomor tiket ini!"); return; }
            await fetch(GAS_URL, {method: 'POST', body: JSON.stringify({no, tgl: document.getElementById('tgl').value, pj, hp: document.getElementById('hp').value, alamat: document.getElementById('alamat').value})});
            alert("Tersimpan!"); location.reload();
        }
        
        async function init() {
            const res = await fetch(GAS_URL); const data = await res.json();
            const grid = document.getElementById('grid');
            for(let i=1; i<=450; i++) {
                let div = document.createElement('div');
                div.className = `ticket-box ${data.find(r => r[0] == i) ? 'bg-merah' : 'bg-hijau'}`;
                div.innerText = i; div.onclick = () => showAuth(i);
                grid.appendChild(div);
            }
        }
        window.onload = init;
    </script>
</body>
</html>
