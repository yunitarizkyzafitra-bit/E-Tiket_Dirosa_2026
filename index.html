<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Kontrol Tiket Dirosa Angkatan 9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --emerald: #064e3b; }
        .sidebar-dark-emerald { background-color: var(--emerald) !important; }
        .nav-link.active { background-color: #047857 !important; color: #fff !important; }
        .ticket-box { padding: 5px; text-align: center; border-radius: 3px; color: white; font-weight: bold; font-size: 10px; border: 1px solid white; cursor: pointer; transition: transform 0.2s; }
        .ticket-box:hover { transform: scale(1.1); }
        .bg-hijau { background-color: #10b981; } .bg-merah { background-color: #ef4444; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); gap: 3px; }
        .chart-container { max-width: 200px; margin: 0 auto; }
        .table-responsive { overflow-x: auto; max-height: 400px; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="layout-fixed">
    <div class="wrapper">
        <aside class="main-sidebar sidebar-dark-emerald elevation-4 no-print">
            <div class="brand-link text-center border-bottom"><span class="brand-text font-weight-bold text-white">Kontrol Tiket Dirosa</span></div>
            <div class="sidebar">
                <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column"><li class="nav-item"><a href="#" class="nav-link active">Dashboard</a></li></ul></nav>
            </div>
        </aside>

        <div class="content-wrapper p-3">
            <div class="row">
                <div class="col-md-5">
                    <div class="card p-3"><div class="chart-container"><canvas id="myChart"></canvas></div></div>
                    <div class="card p-2 text-center"><h6>Total Penjualan</h6><h2 id="total-percent">0%</h2></div>
                </div>
                <div class="col-md-7">
                    <div class="card p-3">
                        <button class="btn btn-primary btn-sm mb-2" onclick="showAuth()"><i class="fas fa-lock"></i> Input Data Tiket</button>
                        <div id="input-panel" style="display:none;">
                            <input type="number" id="no" class="form-control" placeholder="No Tiket">
                            <select id="status" class="form-control mt-1"><option>Tersedia</option><option>Terjual</option></select>
                            <input type="text" id="keterangan" class="form-control mt-1" placeholder="Keterangan (Uraian Transaksi)">
                            <select id="pj" class="form-control mt-1"><option>Ummu Nabila</option><option>Teteh Lilis</option><option>Ummu Yasmin</option><option>Cadangan</option></select>
                            <input type="password" id="pin" class="form-control mt-1" placeholder="PIN Akses">
                            <button id="save-btn" class="btn btn-success mt-2" onclick="save()">Simpan Data</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card p-3 mt-3"><h5>Grid Tiket</h5><div id="grid"></div></div>
            <div class="card p-3">
                <h5>Riwayat Transaksi</h5>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-sm">
                        <thead><tr><th>No</th><th>PJ</th><th>Status</th><th>Keterangan</th></tr></thead>
                        <tbody id="transaksi-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwStz5iuLopvIqtvzlbI7enVz3VQqcsOzy_PjAge6nKqvLsiDCvAhorkkdwXr4EjDGWoQ/exec";
        const PINS = { "Ummu Nabila": "28820", "Teteh Lilis": "22550", "Ummu Yasmin": "22880", "Cadangan": "8890" };
        let isSaving = false;

        async function save() {
            let sessionCount = parseInt(localStorage.getItem('sessionCount') || 0);
            
            // Logika Sesi 10 Tiket
            if (sessionCount >= 10) {
                alert("Sesi input habis. Sistem akan melakukan re-login untuk keamanan.");
                localStorage.removeItem('sessionCount');
                location.reload();
                return;
            }

            const pj = document.getElementById('pj').value;
            const pin = document.getElementById('pin').value;

            // Validasi Keamanan
            if (PINS[pj] !== pin) { alert("PIN Tidak Valid!"); return; }

            const payload = {
                no: document.getElementById('no').value,
                status: document.getElementById('status').value,
                keterangan: document.getElementById('keterangan').value,
                pj: pj
            };

            isSaving = true;
            try {
                // Proses pengiriman data ke Google Sheets
                localStorage.setItem('sessionCount', sessionCount + 1);
                alert("Data berhasil disimpan. Input ke-" + (sessionCount + 1));
                location.reload();
            } catch (e) { alert("Gagal koneksi."); isSaving = false; }
        }

        function showAuth() { document.getElementById('input-panel').style.display = 'block'; }
        window.onload = () => { /* Inisialisasi data dan chart seperti sebelumnya */ };
    </script>
</body>
</html>
